<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>财富大脑训练营</title>
<style>
:root{
  --bg:#FBEDC9; --card:#FFFEF8; --card2:#FFF3D0; --line:#E9D39E; --line2:#D9BC77;
  --gold:#FFA400; --gold-dk:#D67F00; --mint:#22BD73; --mint-dk:#158A54;
  --coral:#FF5F78; --coral-dk:#DE3B58; --violet:#7D66F0; --violet-dk:#5F48D6;
  --sky:#38A1F0; --ink:#43392A; --mut:#9C8A66;
  --r:18px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;overflow-x:hidden}
#app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative}
.screen{display:none;flex:1;padding:16px 16px 110px;animation:fade .3s}
.screen.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@keyframes floatUp{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-60px);opacity:0}}
@keyframes glowPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,164,0,.4)}50%{box-shadow:0 0 0 12px rgba(255,164,0,0)}}
@keyframes flame{0%,100%{transform:scale(1) rotate(-3deg)}50%{transform:scale(1.15) rotate(3deg)}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
/* 登录 */
#s-login{display:none;min-height:100vh;padding:0 24px;flex-direction:column;justify-content:center;text-align:center}
#s-login.on{display:flex}
#s-login .logo{font-size:64px;animation:bob 2.4s infinite}
#s-login h1{font-size:26px;font-weight:800;margin:12px 0 4px}
#s-login h1 em{color:var(--gold-dk);font-style:normal}
#s-login p{color:var(--mut);font-size:13px;margin-bottom:26px}
#s-login input{width:100%;max-width:320px;margin:0 auto;background:var(--card);border:2px solid var(--line);border-radius:99px;padding:14px 20px;font-size:16px;text-align:center;font-family:inherit;color:var(--ink);letter-spacing:2px}
#s-login input:focus{outline:none;border-color:var(--gold)}
#s-login .btn{max-width:320px;margin:16px auto 0}
#s-login .err{color:var(--coral-dk);font-size:13px;min-height:20px;margin-top:10px;font-weight:700}
/* 顶栏 */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 4px 10px}
.brand{font-size:18px;font-weight:800;letter-spacing:1px}
.brand em{color:var(--gold-dk);font-style:normal}
.stats{display:flex;gap:6px;font-size:12px;font-weight:700}
.pill{background:var(--card);border:2px solid var(--line);padding:5px 9px;border-radius:99px;display:flex;align-items:center;gap:4px;box-shadow:0 2px 0 var(--line2)}
.pill.gold{color:var(--gold-dk)} .pill.fire{color:var(--coral-dk)}
.pill.tap{cursor:pointer}
/* 恒温器 */

.thermo-card{background:linear-gradient(160deg,#FFFDF3,#FFEFC2);border:2px solid var(--line2);border-radius:22px;padding:18px;display:flex;gap:18px;align-items:center;margin-bottom:20px;position:relative;overflow:hidden;box-shadow:0 4px 0 var(--line2)}
.thermo{width:54px;height:150px;position:relative;flex:none}
.tube{position:absolute;left:50%;transform:translateX(-50%);bottom:18px;width:18px;height:118px;background:#FFF;border:2px solid var(--line2);border-radius:10px 10px 0 0;overflow:hidden;display:flex;align-items:flex-end}
.mercury{width:100%;background:linear-gradient(to top,var(--gold),#FF6A1F);border-radius:0 0 6px 6px;transition:height 1s cubic-bezier(.2,.8,.2,1)}
.bulb{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:36px;height:36px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFD980,var(--gold));border:2px solid #E5B04E;animation:glowPulse 2.6s infinite}
.thermo-info h2{font-size:14px;color:var(--mut);font-weight:700}
.thermo-info .lvl{font-size:23px;font-weight:800;color:var(--gold-dk);margin:4px 0 8px}
.thermo-info .next{font-size:12px;color:var(--mut)}
.xpbar{height:10px;background:#F1E2B4;border-radius:99px;margin-top:8px;overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#FF6A1F);border-radius:99px;transition:width .8s}

/* 地图 */
.zone{margin-bottom:26px}
.zone-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.zone-head h3{font-size:16px;font-weight:800}
.zone-head .stars{color:var(--gold);font-size:14px;letter-spacing:2px;text-shadow:0 1px 0 #D9B25E}
.path{display:flex;flex-wrap:wrap;gap:13px}
.node{width:72px;height:72px;border-radius:50%;background:var(--card);border:2px solid var(--line2);box-shadow:0 4px 0 var(--line2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--mut);cursor:pointer;position:relative;transition:transform .15s;user-select:none;font-weight:700}
.node:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line2)}
.node .ico{font-size:21px}
.node.done{border-color:#57CE94;background:#E3F9EE;box-shadow:0 4px 0 #57CE94;color:var(--mint-dk)}
.node.study{border-color:#7CB9EF;background:#E7F3FF;box-shadow:0 4px 0 #7CB9EF;color:#1E6FBB;width:86px;height:86px}
.node.study.done{border-color:#57CE94;background:#E3F9EE;box-shadow:0 4px 0 #57CE94;color:var(--mint-dk)}
.node.boss{border-color:#B4A4FF;background:#EFEAFF;box-shadow:0 4px 0 #B4A4FF;color:var(--violet-dk);animation:bob 2.4s infinite}
.node.due::after{content:"复习!";position:absolute;top:-8px;right:-10px;background:var(--coral);color:#fff;font-size:10px;font-weight:800;padding:2px 7px;border-radius:99px;animation:glowPulse 2s infinite}
/* 学习课件 */
.slide-card{background:var(--card);border:2px solid var(--line2);border-radius:22px;padding:20px 18px;box-shadow:0 4px 0 var(--line2);animation:pop .3s;min-height:340px}
.slide-tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:1px;padding:4px 12px;border-radius:99px;margin-bottom:10px;background:#E7F3FF;color:#1E6FBB}
.slide-card h2{font-size:20px;font-weight:800;margin-bottom:12px;line-height:1.4}
.slide-card .body{font-size:15px;line-height:1.85}
.slide-card .body p{margin-bottom:10px}
.slide-card .body b{color:var(--gold-dk)}
.slide-card .quote{background:var(--card2);border-left:4px solid var(--gold);padding:10px 12px;border-radius:0 12px 12px 0;margin:10px 0;font-weight:700;font-size:14px}
.fig{margin:14px auto;text-align:center}
.fig svg{max-width:100%;height:auto}
.fig .cap{font-size:12px;color:var(--mut);margin-top:6px}
.dots{display:flex;gap:6px;justify-content:center;margin:16px 0 4px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line2);transition:all .2s}
.dots i.on{background:var(--gold);width:22px;border-radius:99px}
.slide-nav{display:flex;gap:10px}
.slide-nav .btn{flex:1;margin-top:12px}
.mini-opt{display:block;width:100%;background:var(--card2);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:12px;font-size:14px;margin:8px 0;cursor:pointer;text-align:left;font-family:inherit;color:var(--ink);font-weight:700}
.mini-opt:active{transform:translateY(2px)}
.mini-opt.ok{border-color:var(--mint);background:#E3F9EE;color:var(--mint-dk)}
.mini-opt.no{border-color:var(--coral);background:#FFE9ED;color:var(--coral-dk);animation:shake .3s}
.mini-fb{font-size:13px;line-height:1.7;margin-top:8px;display:none;background:#FFF7E0;border:2px dashed var(--gold);border-radius:12px;padding:10px}
/* 会话 */
.sess-top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.quit{font-size:22px;color:var(--mut);cursor:pointer;border:none;background:none}
.prog{flex:1;height:16px;background:#F1E2B4;border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),#4FDD97);border-radius:99px;transition:width .4s;width:0}
.hearts{font-size:15px;letter-spacing:1px}
.combo{position:absolute;right:16px;top:64px;font-weight:800;color:var(--gold-dk);font-size:14px;display:none;align-items:center;gap:4px;z-index:5}
.combo.on{display:flex}
.combo .f{animation:flame .5s infinite}
.qtype{display:inline-block;font-size:11px;font-weight:800;letter-spacing:1px;padding:4px 10px;border-radius:99px;margin-bottom:12px}
.qtype.mc{background:#E3F0FF;color:#2273CE}.qtype.tf{background:#FAE4FF;color:#A63BD1}
.qtype.case{background:#FFEFCB;color:#C27B00}.qtype.fey{background:#ECE6FF;color:var(--violet-dk)}
.qtext{font-size:18px;font-weight:700;line-height:1.6;margin-bottom:18px;animation:pop .3s}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{background:var(--card);border:2px solid var(--line2);border-bottom-width:4px;border-radius:var(--r);padding:14px;font-size:15px;line-height:1.5;cursor:pointer;text-align:left;color:var(--ink);transition:transform .1s;width:100%;font-family:inherit}
.opt:active{transform:translateY(2px);border-bottom-width:2px}
.opt.ok{border-color:var(--mint);background:#E3F9EE;color:var(--mint-dk);font-weight:700}
.opt.no{border-color:var(--coral);background:#FFE9ED;color:var(--coral-dk);animation:shake .35s}
textarea.fey{width:100%;min-height:130px;background:var(--card);border:2px solid var(--line2);border-radius:var(--r);color:var(--ink);padding:14px;font-size:16px;line-height:1.6;font-family:inherit;resize:vertical}
textarea.fey:focus{outline:none;border-color:var(--violet)}
.btn{display:block;width:100%;border:none;border-radius:var(--r);padding:15px;font-size:16px;font-weight:800;cursor:pointer;margin-top:16px;transition:transform .1s,filter .15s;font-family:inherit}
.btn:active{transform:translateY(3px)}
.btn.p{background:var(--gold);color:#4C3200;box-shadow:0 4px 0 var(--gold-dk)}
.btn.p:active{box-shadow:0 1px 0 var(--gold-dk)}
.btn.g{background:var(--card);color:var(--ink);border:2px solid var(--line2);box-shadow:0 4px 0 var(--line2)}
.btn.g:active{box-shadow:0 1px 0 var(--line2)}
.btn.b{background:var(--sky);color:#fff;box-shadow:0 4px 0 #1E6FBB}
.btn:disabled{filter:grayscale(.6);opacity:.6;pointer-events:none}
.fb{border-radius:var(--r);padding:14px;margin-top:16px;font-size:14px;line-height:1.65;animation:pop .3s}
.fb.ok{background:#E3F9EE;border:2px solid #57CE94} .fb.no{background:#FFE9ED;border:2px solid #FFAFBE}
.fb b{display:block;margin-bottom:4px;font-size:15px}
.fb.ok b{color:var(--mint-dk)} .fb.no b{color:var(--coral-dk)}
.xp-float{position:fixed;font-weight:800;color:var(--gold-dk);font-size:18px;pointer-events:none;animation:floatUp 1s forwards;z-index:99;text-shadow:0 1px 0 #FFF}
/* 结果 */
.result{text-align:center;padding-top:36px}
.result .big{font-size:64px;animation:pop .5s}
.result h2{font-size:24px;font-weight:800;margin:10px 0 6px}
.result p{color:var(--mut);font-size:14px}
.r-grid{display:flex;gap:10px;margin:24px 0}
.r-cell{flex:1;background:var(--card);border:2px solid var(--line2);border-radius:var(--r);padding:14px 6px;box-shadow:0 3px 0 var(--line2)}
.r-cell b{display:block;font-size:22px;font-weight:800}
.r-cell span{font-size:12px;color:var(--mut)}
.r-cell.gold b{color:var(--gold-dk)} .r-cell.mint b{color:var(--mint-dk)} .r-cell.vio b{color:var(--violet-dk)}
/* 错题本 */
.w-item{background:var(--card);border:2px solid var(--line2);border-radius:var(--r);padding:14px;margin-bottom:10px;font-size:14px;line-height:1.5;box-shadow:0 3px 0 var(--line2)}
.w-item .tag{font-size:11px;color:var(--coral-dk);font-weight:800}
.w-item .due{font-size:11px;color:var(--mut);margin-top:6px}
.mastery{height:8px;background:#F1E2B4;border-radius:99px;margin-top:8px;overflow:hidden}
.mastery i{display:block;height:100%;background:linear-gradient(90deg,var(--coral),var(--gold),var(--mint));border-radius:99px}
/* 徽章 */
.b-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.badge{background:var(--card);border:2px solid var(--line2);border-radius:var(--r);padding:16px 8px;text-align:center;box-shadow:0 3px 0 var(--line2)}
.badge .bi{font-size:30px;filter:grayscale(1);opacity:.3}
.badge.got{border-color:#F0BE55;background:#FFF6DD;box-shadow:0 3px 0 #F0BE55}
.badge.got .bi{filter:none;opacity:1;animation:pop .4s}
.badge b{display:block;font-size:12px;margin-top:8px}
.badge span{font-size:10px;color:var(--mut)}
/* 导师 */
.chat{display:flex;flex-direction:column;gap:10px;padding-bottom:80px}
.msg{max-width:85%;padding:12px 14px;border-radius:18px;font-size:14px;line-height:1.65;white-space:pre-wrap}
.msg.ai{background:var(--card);border:2px solid var(--line2);align-self:flex-start;border-bottom-left-radius:6px}
.msg.me{background:#ECE6FF;border:2px solid #CBBDFF;color:#43348F;align-self:flex-end;border-bottom-right-radius:6px}
.chat-in{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);width:min(520px,100%);padding:8px 16px;display:flex;gap:8px;background:linear-gradient(to top,var(--bg) 70%,transparent);z-index:40}
.chat-in input{flex:1;min-width:0;background:var(--card);border:2px solid var(--line2);border-radius:99px;padding:12px 16px;color:var(--ink);font-size:16px;font-family:inherit}
.chat-in input:focus{outline:none;border-color:var(--violet)}
.chat-in button{border:none;background:var(--violet);color:#fff;border-radius:99px;width:46px;flex:none;font-size:18px;cursor:pointer;box-shadow:0 3px 0 var(--violet-dk)}
/* 底部导航+署名 */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);background:#FFFBEE;border-top:2px solid var(--line);z-index:50;padding-bottom:env(safe-area-inset-bottom)}
.nav .row{display:flex}
.nav button{flex:1;background:none;border:none;color:var(--mut);padding:9px 0 4px;font-size:11px;cursor:pointer;font-family:inherit;font-weight:700}
.nav button .ni{display:block;font-size:20px;margin-bottom:2px}
.nav button.on{color:var(--gold-dk)}
.credit{text-align:center;font-size:10px;color:#C4B48D;padding:2px 0 6px;letter-spacing:1px}
.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:#FFFBEE;border:2px solid var(--gold);color:var(--ink);padding:12px 20px;border-radius:99px;font-size:14px;font-weight:700;z-index:200;animation:pop .3s;box-shadow:0 6px 20px rgba(140,100,0,.2);max-width:90vw}
.confetti{position:fixed;top:-20px;width:10px;height:14px;z-index:150;animation:fall 2.6s linear forwards;pointer-events:none}
.spin{display:inline-block;width:16px;height:16px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:sp 1s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
.hint{font-size:12px;color:var(--mut);margin-top:8px;line-height:1.6}
.mask{position:fixed;inset:0;background:rgba(60,45,10,.45);z-index:300;display:flex;align-items:center;justify-content:center;animation:fade .2s}
.sheet{background:var(--card);border:2px solid var(--line2);border-radius:22px;padding:22px;width:min(340px,88vw);box-shadow:0 10px 40px rgba(80,55,0,.3);animation:pop .25s}
.sheet .btn{margin-top:10px}
body{-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
.hub-home{position:fixed;right:14px;bottom:94px;z-index:80;width:44px;height:44px;display:grid;place-items:center;border:2px solid var(--line2);border-radius:50%;background:var(--card);color:var(--ink);text-decoration:none;font-size:20px;box-shadow:0 4px 0 var(--line2)}
.hub-home:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line2)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<a class="hub-home" href="/" aria-label="返回学习训练中心" title="返回学习训练中心">⌂</a>
<div id="app">
  <!-- 登录 -->
  <div class="screen" id="s-login">
    <div class="logo">💰</div>
    <h1>财富<em>大脑</em>训练营</h1>
    <p>把一本书，变成一场训练大脑的游戏<br>先学（BOPPPS课堂）→ 再练 → 费曼 → 错题复习</p>
    <input id="acct" placeholder="请输入账号" autocomplete="off">
    <div class="err" id="login-err"></div>
    <button class="btn p" onclick="doLogin()">进入训练营 🚀</button>
    <div class="credit" style="margin-top:30px">湖州师范大学陶维东教授制</div>
  </div>

  <div id="main" style="display:none">
  <div class="topbar">
    <div class="brand">💰 财富<em>大脑</em>训练营</div>
    <div class="stats">
      <div class="pill fire" id="p-streak">🔥 0</div>
      <div class="pill gold" id="p-coin">🪙 0</div>
      <div class="pill tap" id="p-snd" onclick="toggleSnd()">🔊</div>
      <div class="pill tap" onclick="openSettings()" title="设置">⚙️</div>
    </div>
  </div>

  <div class="screen on" id="s-home"></div>
  <div class="screen" id="s-study"></div>
  <div class="screen" id="s-session"></div>
  <div class="screen" id="s-result"></div>
  <div class="screen" id="s-wrong"></div>
  <div class="screen" id="s-badges"></div>
  <div class="screen" id="s-shop"></div>
  <div class="screen" id="s-tutor">
    <div class="chat" id="chatlog"></div>
    <div class="chat-in">
      <input id="chat-input" placeholder="向AI老师提问，或回答老师的追问…" onkeydown="if(event.key==='Enter')sendChat()">
      <button onclick="sendChat()" aria-label="发送">➤</button>
    </div>
  </div>

  <div class="nav">
    <div class="row">
      <button class="on" data-s="s-home" onclick="nav('s-home',this)"><span class="ni">🗺️</span>地图</button>
      <button data-s="s-wrong" onclick="nav('s-wrong',this)"><span class="ni">📕</span>错题本</button>
      <button data-s="s-badges" onclick="nav('s-badges',this)"><span class="ni">🏅</span>徽章</button>
      <button data-s="s-shop" onclick="nav('s-shop',this)"><span class="ni">🎁</span>商城</button>
      <button data-s="s-tutor" onclick="nav('s-tutor',this)"><span class="ni">🧙</span>AI老师</button>
    </div>
    <div class="credit">湖州师范大学陶维东教授制</div>
  </div>
  </div>
</div>

<script>
/* ====== 管理员配置区（陶老师可编辑）====== */
window.APP_CONFIG={
  PAY_ENABLED:false,          /* 收费功能开关：改为 true 开启 */
  PAY_QR:""                   /* 开启后，把支付二维码图片的 base64 或网址填在这里 */
};
</script>
<script>
/* ====== 内容保护 ====== */
(function(){
  document.addEventListener("contextmenu",function(e){e.preventDefault();});
  document.addEventListener("copy",function(e){
    if(!/INPUT|TEXTAREA/.test((e.target.tagName||"")))e.preventDefault();
  });
  document.addEventListener("keydown",function(e){
    var k=(e.key||"").toLowerCase();
    if(e.key==="F12"||(e.ctrlKey&&e.shiftKey&&(k==="i"||k==="j"||k==="c"))||(e.ctrlKey&&(k==="u"||k==="s"||k==="p"))){
      e.preventDefault();e.stopPropagation();
    }
  },true);
  var warned=false;
  setInterval(function(){
    var w=window.outerWidth-window.innerWidth>200, hh=window.outerHeight-window.innerHeight>240;
    if((w||hh)&&!warned){warned=true;
      try{var t=document.createElement("div");t.className="toast";t.textContent="🔒 本程序内容受保护 · 湖州师范大学陶维东教授制";document.body.appendChild(t);setTimeout(function(){t.remove();},3000);}catch(x){}
    }
  },2500);
})();
</script>
<script>
