name: Import Solution Island source
on:
  push:
    branches: [main]
    paths: [source-package.zip]
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand source archive
        run: |
          unzip -o source-package.zip
          rm -f source-package.zip .github/workflows/unpack.yml
      - name: Commit normal source tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import complete Solution Island source"
          git push
